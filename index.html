<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d13">
<title>OVERDRIVE – Neon Arcade Dodger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d13;--pk:#ff007f;--cy:#00f0ff;--gr:#39ff14;--d:Orbitron,'Arial Black',Impact,sans-serif;--a:'Press Start 2P','Courier New',monospace;--h:calc(100vh - 28px)}
@supports(height:100dvh){:root{--h:calc(100dvh - 28px)}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg) radial-gradient(ellipse at 50% -10%,rgba(255,0,127,.15),transparent 55%) no-repeat;color:var(--cy);font-family:var(--a);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cab{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
#stage{position:relative;width:min(100%,calc(var(--h)*2/3),560px);aspect-ratio:2/3;border:2px solid var(--cy);background:var(--bg);overflow:hidden;touch-action:none;box-shadow:0 0 calc(14px + var(--p,0)*28px) var(--cy),0 0 80px rgba(255,0,127,.3),inset 0 0 28px rgba(0,240,255,.18)}
#stage.hit{animation:hit .7s}
@keyframes hit{10%{transform:translate(-14px,6px)}20%{transform:translate(12px,-8px)}30%{transform:translate(-10px,-5px)}40%{transform:translate(8px,7px)}50%{transform:translate(-5px,3px)}70%{transform:translate(3px,-2px)}100%{transform:none}}
#cv{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:12px 16px;pointer-events:none;font-size:.5rem;color:#8fe3e9;z-index:2}
#hud b{display:block;margin-top:7px;font:900 1.3rem var(--d);color:var(--cy);text-shadow:0 0 10px var(--cy)}
#hud div:nth-child(2){text-align:center}#hud div:last-child{text-align:right}
#hud #hm{color:var(--gr);text-shadow:0 0 10px var(--gr)}
#hud #hs
